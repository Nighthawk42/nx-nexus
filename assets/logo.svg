<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="NX-Nexus">
  <title>NX-Nexus</title>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- The mark is a nexus: one hub with links radiating to satellites, which
       is what the tool is -- the point where console and computer meet. -->
  <g transform="translate(100 100)">
    <g stroke="url(#edge)" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="0" x2="0"   y2="-58"/>
      <line x1="0" y1="0" x2="50"  y2="-29"/>
      <line x1="0" y1="0" x2="50"  y2="29"/>
      <line x1="0" y1="0" x2="0"   y2="58"/>
      <line x1="0" y1="0" x2="-50" y2="29"/>
      <line x1="0" y1="0" x2="-50" y2="-29"/>
    </g>

    <g fill="#0f172a" stroke="url(#edge)" stroke-width="6">
      <circle cx="0"   cy="-58" r="11"/>
      <circle cx="50"  cy="-29" r="11"/>
      <circle cx="50"  cy="29"  r="11"/>
      <circle cx="0"   cy="58"  r="11"/>
      <circle cx="-50" cy="29"  r="11"/>
      <circle cx="-50" cy="-29" r="11"/>
    </g>

    <circle cx="0" cy="0" r="24" fill="url(#edge)"/>
    <circle cx="0" cy="0" r="11" fill="#0f172a"/>
  </g>

  <text x="200" y="118"
        font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="62" font-weight="700" letter-spacing="-1"
        fill="url(#word)">NX<tspan fill="#38bdf8">-</tspan>Nexus</text>

  <text x="203" y="150"
        font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="16" letter-spacing="3.4" fill="#64748b">MTP SERVER FOR NINTENDO SWITCH</text>
</svg>
